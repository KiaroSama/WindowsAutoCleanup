name: Apply review 6 patch

on:
  push:
    branches: [audit/review6-recovery-regressions]
    paths: [.github/workflows/review6-apply.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'KiaroSama/WindowsAutoCleanup' && github.actor == 'KiaroSama' && github.ref == 'refs/heads/audit/review6-recovery-regressions'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Apply only the validated source correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('Tests/VmDeploymentLifecycle.Tests.ps1')
          # Git blobs are LF; .gitattributes checks PowerShell files out with CRLF on every OS.
          source = p.read_bytes().replace(b'\r\n', b'\n')
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob(source) == '45bd0763cd8ca7dde72afbbef7c072eaae1b414d'
          text = source.decode('ascii')
          replacements = {
              "@($lookup.Task).Count)))\n        $proof": "@($lookup.Task).Count)))\n\n        $proof",
              "'no task was found after the install' }))))": "'no task was found after the install' })))",
              '-Detail $action)))': '-Detail $action))',
              '[string]$ownedAgain.Reason))))': '[string]$ownedAgain.Reason)))',
              '-Detail ([string]$slots.Previous))))': '-Detail ([string]$slots.Previous)))',
              '-Detail ([string]$tampered.Reason))))': '-Detail ([string]$tampered.Reason)))',
              '-Detail $reason)))': '-Detail $reason))',
          }
          for before, after in replacements.items():
              assert text.count(before) == 1, before
              text = text.replace(before, after)
          result = text.encode('ascii')
          assert blob(result) == '85ad611fbf9831d82ab99455c1d7eec32589af84'
          p.write_bytes(result.replace(b'\n', b'\r\n'))
          PY
          git add Tests/VmDeploymentLifecycle.Tests.ps1
          git diff --cached --check
          git config user.name 'WindowsAutoCleanup review'
          git config user.email '106400900+KiaroSama@users.noreply.github.com'
          git commit -m 'test: finalize byte-verified live lifecycle evidence checks'
      - name: Publish only to the existing review branch
        shell: bash
        env:
          REVIEW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          header=$(printf 'x-access-token:%s' "$REVIEW_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/audit/review6-recovery-regressions
