name: Apply review 6 patch

on:
  push:
    branches: [audit/review6-recovery-regressions]
    paths: [.github/workflows/review6-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'KiaroSama/WindowsAutoCleanup' && github.actor == 'KiaroSama' && github.ref == 'refs/heads/audit/review6-recovery-regressions'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Apply byte-verified patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 0c83c7d1bd7284645e555531ff97a001e2c330c6
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re, subprocess, zlib
          def source(ref):
              return subprocess.check_output(['git', 'show', ref + ':.github/workflows/review6-apply.yml']).decode()
          def block(text, name):
              return ''.join(re.search(name + r': >-\n(.*?)\n        run:', text, re.S).group(1).split())
          encoded = block(source('HEAD^^'), 'PATCH_DATA')
          missing = block(source('HEAD^'), 'MISSING_SEGMENT')
          anchor = '+eT09Lfzs99'
          assert encoded.count(anchor) == 1
          at = encoded.index(anchor) + len(anchor)
          assert encoded[at:].startswith('lu/1+D+k++qLR')
          patch = zlib.decompress(base64.b64decode(encoded[:at] + missing + encoded[at:]))
          assert hashlib.sha256(patch).hexdigest() == 'e462729b9bf7bda0f4cc284d55f961e147e04efc1f365a182229ec54bf4f86fc'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'review6.patch').write_bytes(patch)
          PY
          git apply --index --unidiff-zero "$RUNNER_TEMP/review6.patch"
          git diff --cached --check
          git config user.name 'WindowsAutoCleanup review'
          git config user.email '106400900+KiaroSama@users.noreply.github.com'
          git commit -m 'fix: fence interrupted uninstall and complete recovery compatibility'
      - name: Publish only to the review branch
        shell: bash
        env:
          REVIEW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          header=$(printf 'x-access-token:%s' "$REVIEW_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/audit/review6-recovery-regressions
