name: Apply review 6 patch

on:
  push:
    branches: [audit/review6-recovery-regressions]
    paths: [.github/workflows/review6-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'KiaroSama/WindowsAutoCleanup' && github.actor == 'KiaroSama' && github.ref == 'refs/heads/audit/review6-recovery-regressions'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply only independently verified source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = dbba270b1a73f3d83af3e38031ab1063a2b982ca
          python3 .github/review6-finalize.py
          # Workflow edits are reviewed and published separately through the authorized connector.
          git restore --worktree .github/workflows
          git rm .github/review6-finalize.py
          git add -u
          git diff --cached --check
          git config user.name 'WindowsAutoCleanup review'
          git config user.email '106400900+KiaroSama@users.noreply.github.com'
          git commit -m 'fix: respect run deadline after root exit and align recovery documentation'
      - name: Publish only to the existing review branch
        shell: bash
        env:
          REVIEW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          header=$(printf 'x-access-token:%s' "$REVIEW_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/audit/review6-recovery-regressions
