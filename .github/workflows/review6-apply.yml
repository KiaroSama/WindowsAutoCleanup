name: Apply review 6 patch

on:
  push:
    branches: [audit/review6-recovery-regressions]
    paths: [.github/workflows/review6-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'KiaroSama/WindowsAutoCleanup' && github.actor == 'KiaroSama' && github.ref == 'refs/heads/audit/review6-recovery-regressions'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply only the byte-verified source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f735cfe1a92cbdcffdd621186fe68fcaae384268
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re, subprocess, zlib
          source = subprocess.check_output(['git', 'show', 'HEAD^:.github/workflows/review6-apply.yml']).decode()
          data = re.search(r'PATCH_DATA: >-\s+([A-Za-z0-9+/=]+)', source).group(1)
          # These transport repairs were independently compared with the local source diff.
          data = data[:741] + data[1194:]
          data = data[:570] + 'De' + data[571:]
          patch = zlib.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == 'cf14f7253200a13a26b722147e12346ecea23cfa21b4d0039b90ecba250ebbc4'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'review6.patch').write_bytes(patch)
          PY
          git apply --index "$RUNNER_TEMP/review6.patch"
          git diff --cached --check
          git config user.name 'WindowsAutoCleanup review'
          git config user.email '106400900+KiaroSama@users.noreply.github.com'
          git commit -m 'fix: complete task recovery proof and launch deadline admission'
      - name: Publish only to the review branch
        shell: bash
        env:
          REVIEW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          header=$(printf 'x-access-token:%s' "$REVIEW_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/audit/review6-recovery-regressions
