name: Apply review 6 patch

on:
  push:
    branches: [audit/review6-recovery-regressions]
    paths: [.github/workflows/review6-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'KiaroSama/WindowsAutoCleanup' && github.actor == 'KiaroSama' && github.ref == 'refs/heads/audit/review6-recovery-regressions'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply the verified patch to the review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = dbe49d123afadb7dc74997bfee0795b754da8aff
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re, subprocess, zlib
          source = subprocess.check_output(['git', 'show', 'HEAD^:.github/workflows/review6-apply.yml']).decode()
          encoded = re.search(r'PATCH_DATA: >-\s+([A-Za-z0-9+/=]+)', source).group(1)
          # Repair the identified transport truncation, then verify every decompressed byte.
          assert encoded.count('Ru1Yl5lYH6TDOqNVeOZDd1tmaevGF7EcXAj') == 1
          encoded = encoded.replace('Ru1Yl5lYH6TDOqNVeOZDd1tmaevGF7EcXAj', 'Ru1Yl5lYH6TDOqNVeOZDd1tmaevGF7mfFkV7EcXAj')
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'fe83104b9df2168b2e895614599ad527d5deb6b6d431806c195cc9b52d19b0dd'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'review6.patch').write_bytes(patch)
          PY
          git apply --index "$RUNNER_TEMP/review6.patch"
          git diff --cached --check
          git config user.name 'WindowsAutoCleanup review'
          git config user.email '106400900+KiaroSama@users.noreply.github.com'
          git commit -m 'fix: preserve recovery evidence and distinguish restart proof from wall time'
      - name: Publish only to the existing review branch
        shell: bash
        env:
          REVIEW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          header=$(printf 'x-access-token:%s' "$REVIEW_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/audit/review6-recovery-regressions
