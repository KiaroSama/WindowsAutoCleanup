name: Review reporting regressions

on:
  push:
    branches: [audit/review7-state-safety]

permissions:
  contents: read

jobs:
  reporting:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Execute the focused cases on both hosts
        shell: pwsh
        run: |
          .\Tests\Run-Tests.ps1 -Host both -Filter Review7 -ManifestPath "$env:RUNNER_TEMP\review-manifest.txt" *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\review-output.log"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reporting-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/review-manifest.txt
            ${{ runner.temp }}/review-output.log
          if-no-files-found: error
          retention-days: 14
