name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository or to any package registry.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # Do not stop the other image when one fails: an OS-specific regression is exactly what a
      # second baseline exists to show, and cancelling its sibling hides half the evidence.
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]

    # The matrix drives `runs-on` ONLY. `shell:` is resolved before matrix expansion, so binding
    # THAT to a matrix value is rejected with "Unrecognized named-value: 'matrix'" and the run dies
    # before a job starts - which is why an earlier attempt concluded a matrix was impossible here.
    # It is not: `runs-on` expands normally, and the shell stays the literal `pwsh`.
    #
    # The two axes are different questions and both are needed. Run-Tests.ps1 -Host both already
    # covers the two POWERSHELL hosts inside one job; this covers two WINDOWS baselines, where the
    # differences that bite this project live - scheduler behaviour, cleanmgr handler sets, DISM and
    # the shape of a profile.

    steps:
      - name: Checkout
        # Pinned to the full commit SHA of v7: a tag is mutable, and this workflow runs with the
        # repository token. persist-credentials:false because nothing here pushes - leaving the
        # token in .git/config would hand it to every later step and to anything they execute.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Whitespace and conflict markers
        shell: pwsh
        timeout-minutes: 2
        run: |
          # Diffing against the empty-tree object lints EVERY tracked file, not just the last commit:
          # a trailing space or a leftover conflict marker that arrived three commits ago is still in
          # the tree someone clones.
          $emptyTree = '4b825dc642cb6eb9a060e54bf8d69288fbee4904'
          git diff --check $emptyTree HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'git diff --check reported whitespace errors or conflict markers.'
            exit 1
          }
          Write-Host 'No whitespace errors or conflict markers.'

      - name: Static analysis
        shell: pwsh
        timeout-minutes: 10
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          # The one floating external input this repository has. There is no manifest and no
          # lockfile, so nothing else records which analyzer produced a given result, and dependabot
          # has no ecosystem to watch it through. Unpinned, a new default rule turns an unrelated
          # pull request red with findings about code it never touched, and nothing in the diff or
          # the log explains why today differs from yesterday. Bumping this is a deliberate commit:
          # update the version, rerun the scan locally, and fix what the new rules find in the same
          # change. The guard filters on the exact version because a runner image that ships its own
          # PSScriptAnalyzer would otherwise win and make the pin cosmetic.
          $analyzerVersion = '1.25.0'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq $analyzerVersion })) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module -Name PSScriptAnalyzer -RequiredVersion $analyzerVersion -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $analyzerVersion
          Write-Host ('PSScriptAnalyzer {0}' -f (Get-Module PSScriptAnalyzer).Version)
          # Scan the SHIPPED set rather than '.', so the identical command is runnable in a working
          # tree that also holds git-ignored agent runtimes and gives the same answer as CI.
          $shipped = @('Run.ps1', 'Install-WindowsAutoCleanupTask.ps1', 'Uninstall-WindowsAutoCleanupTask.ps1', 'src', 'Tests')
          $findings = @($shipped | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings .\Tests\PSScriptAnalyzerSettings.psd1 })
          if ($findings.Count -gt 0) {
            $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 240 | Write-Host
            Write-Host ('PSScriptAnalyzer reported {0} finding(s) at Error or Warning severity.' -f $findings.Count)
            exit 1
          }
          Write-Host 'PSScriptAnalyzer is clean.'

      - name: Record the environment this evidence belongs to
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          # Evidence with no provenance is not evidence: a captured failure has to say which commit,
          # image, architecture and host versions produced it, or it cannot be reproduced later.
          $facts = [ordered]@{
            commit          = $env:GITHUB_SHA
            ref             = $env:GITHUB_REF
            runId           = $env:GITHUB_RUN_ID
            runAttempt      = $env:GITHUB_RUN_ATTEMPT
            imageLabel      = '${{ matrix.os }}'
            imageName       = $env:ImageOS
            imageVersion    = $env:ImageVersion
            osCaption       = (Get-CimInstance Win32_OperatingSystem).Caption
            osBuild         = [string][Environment]::OSVersion.Version
            architecture    = $env:PROCESSOR_ARCHITECTURE
            pwshVersion     = [string]$PSVersionTable.PSVersion
            windowsPsVersion = (& "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')
            analyzerVersion = '1.25.0'
          }
          $facts | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath "$env:RUNNER_TEMP\run-environment.json" -Encoding UTF8
          Get-Content -LiteralPath "$env:RUNNER_TEMP\run-environment.json" | Write-Host

      - name: Tests on both PowerShell hosts
        shell: pwsh
        timeout-minutes: 20
        run: |
          # Tee rather than plain output: the transcript is uploaded as an artifact on success AND
          # on failure, because the runner's own log is the only other copy and a failed matrix leg
          # is exactly when somebody needs the per-suite detail after the fact.
          .\Tests\Run-Tests.ps1 -Host both -ManifestPath "$env:RUNNER_TEMP\executed-suites.txt" *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\test-output.log"
          exit $LASTEXITCODE

      - name: Guard - every discovered suite ran
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          # -Recurse matters: without it this guard shares the runner's blind spot, so a suite in a
          # Tests subdirectory would never run AND the guard would still report success.
          #
          # A run is identified by its suite path relative to Tests\ PLUS the host it ran on, exactly
          # as the runner writes it to the manifest. Both halves are load-bearing. On the path half,
          # keying by bare file name would let two same-named suites in different subdirectories
          # collapse into one entry on BOTH sides of this comparison, so a run that executed only one
          # of them would read as complete. On the host half, a host-less entry lets a suite that ran
          # on pwsh stand in for the 5.1 run it never had - and the two hosts are precisely where
          # this project's defects live.
          $suiteRoot = (Resolve-Path -LiteralPath 'Tests').ProviderPath.TrimEnd('\') + '\'
          $discovered = @(Get-ChildItem -LiteralPath 'Tests' -Filter '*.Tests.ps1' -File -Recurse | ForEach-Object { $_.FullName.Substring($suiteRoot.Length) } | Sort-Object -Unique)
          if ($discovered.Count -eq 0) { Write-Host 'No suite matching Tests\*.Tests.ps1 exists.'; exit 1 }

          # Must match the -Host argument of the step above; the expected matrix is built here rather
          # than read from the manifest, because a matrix derived from the results could never notice
          # a host that produced no results at all.
          $hostKinds = @('pwsh', 'powershell')

          $manifest = Join-Path $env:RUNNER_TEMP 'executed-suites.txt'
          if (-not (Test-Path -LiteralPath $manifest)) { Write-Host 'The runner wrote no manifest, so no suite can be proven to have run.'; exit 1 }

          # Entries are path|host|status and are written when a run COMPLETES, so presence here is
          # evidence of a finished run rather than of a launch.
          $completed = @{}
          foreach ($line in @(Get-Content -LiteralPath $manifest | Where-Object { $_.Trim() })) {
            $parts = $line -split '\|', 3
            if ($parts.Count -lt 3) { Write-Host ('Unparsable manifest entry: {0}' -f $line); exit 1 }
            $completed[('{0}|{1}' -f $parts[0], $parts[1])] = $parts[2]
          }

          $missing = @()
          foreach ($suite in $discovered) {
            foreach ($hostKind in $hostKinds) {
              $key = '{0}|{1}' -f $suite, $hostKind
              if (-not $completed.ContainsKey($key)) { $missing += $key }
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host ('These suite x host runs produced no completed result: {0}' -f ($missing -join ', '))
            exit 1
          }

          # Reported, not failed on: a suite that ran and failed is the TEST step's verdict to give.
          # This guard answers one question - was anything omitted - and saying "did not run" about a
          # suite that ran and failed would be a false statement, not a stricter check.
          $notClean = @($completed.GetEnumerator() | Where-Object { $_.Value -ne 'exit=0' } | ForEach-Object { '{0} ({1})' -f $_.Key, $_.Value })
          if ($notClean.Count -gt 0) { Write-Host ('Completed but not clean: {0}' -f ($notClean -join ', ')) }

          # A TOTAL line is not evidence on its own. A suite that declared no cases, or whose counts
          # do not add up, or whose exit code disagrees with its own failure count, produced a green
          # shape without proving anything - and the substring check that used to stand here
          # accepted all three. The per-run totals are parsed and reconciled against the exit code.
          $log = Join-Path $env:RUNNER_TEMP 'test-output.log'
          if (-not (Test-Path -LiteralPath $log)) { Write-Host 'The test transcript is missing, so case totals cannot be checked.'; exit 1 }

          $runs = @()
          $currentExit = $null
          foreach ($line in (Get-Content -LiteralPath $log)) {
            $header = [regex]::Match($line, '^--- (?<suite>.+?) \[(?<host>.+?)\] exit=(?<exit>\d+)')
            if ($header.Success) { $currentExit = [int]$header.Groups['exit'].Value; continue }
            $total = [regex]::Match($line, 'TOTAL cases=(?<cases>\d+) passed=(?<passed>\d+) failed=(?<failed>\d+) skipped=(?<skipped>\d+)')
            if (-not $total.Success -or $null -eq $currentExit) { continue }
            $runs += [pscustomobject]@{
              Cases   = [int]$total.Groups['cases'].Value
              Passed  = [int]$total.Groups['passed'].Value
              Failed  = [int]$total.Groups['failed'].Value
              Skipped = [int]$total.Groups['skipped'].Value
              Exit    = $currentExit
            }
            $currentExit = $null
          }

          if ($runs.Count -ne $completed.Count) {
            Write-Host ('Parsed {0} TOTAL line(s) for {1} completed run(s); the transcript and the manifest disagree.' -f $runs.Count, $completed.Count)
            exit 1
          }
          $empty = @($runs | Where-Object { $_.Cases -lt 1 })
          if ($empty.Count -gt 0) { Write-Host ('{0} run(s) declared no cases at all.' -f $empty.Count); exit 1 }
          $inconsistent = @($runs | Where-Object { ($_.Passed + $_.Failed + $_.Skipped) -ne $_.Cases })
          if ($inconsistent.Count -gt 0) { Write-Host ('{0} run(s) have totals that do not add up.' -f $inconsistent.Count); exit 1 }
          $lying = @($runs | Where-Object { ($_.Failed -gt 0 -and $_.Exit -eq 0) -or ($_.Failed -eq 0 -and $_.Skipped -eq 0 -and $_.Exit -ne 0) })
          if ($lying.Count -gt 0) { Write-Host ('{0} run(s) have an exit code that disagrees with their own case counts.' -f $lying.Count); exit 1 }

          $totalCases = ($runs | Measure-Object -Property Cases -Sum).Sum
          Write-Host ('All {0} discovered suite(s) completed on all {1} host(s): {2} runs, {3} case executions, totals consistent with every exit code.' -f `
            $discovered.Count, $hostKinds.Count, $completed.Count, $totalCases)

      - name: Upload run evidence
        # ALWAYS, not only on failure. A green run's manifest, transcript and environment record are
        # what a later investigation compares a red one against; keeping them only when something
        # broke means there is never a baseline to compare with.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 5
        with:
          # Unique per matrix leg: two legs uploading the same name collide and one is lost.
          name: run-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-output.log
            ${{ runner.temp }}/executed-suites.txt
            ${{ runner.temp }}/run-environment.json
          if-no-files-found: warn
          retention-days: 14

  # THE LANE THAT NEEDS A MACHINE IT MAY CHANGE (ledger WAC-02R). Every other job here is read-only
  # about the host: this one installs a real SYSTEM scheduled task, deploys to the real deployment
  # root, triggers the task through the scheduler, upgrades, rolls back and uninstalls. It is the
  # only way to prove the installation transaction end to end, and it cannot run on anyone's
  # workstation - which is why the suite refuses unless WAC_VM_DEPLOYMENT_LIFECYCLE=1 AND the
  # session is elevated, and why a refused lane is a pass that has validated nothing.
  #
  # A GitHub-hosted runner IS the disposable, explicitly armed Windows guest the lane asks for: it
  # is an ephemeral VM, it runs elevated, and it is destroyed when the job ends. A SELF-HOSTED
  # runner is somebody's machine, so the first step refuses there rather than trusting the label.
  #
  # Separate from `validate` on purpose: that job must stay a clean-room read of the unit suites, and
  # a machine-changing lane sharing its runner would make every later suite's environment a
  # consequence of this one.
  deployment-lifecycle:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Refuse a runner this lane may not change
        shell: pwsh
        run: |
          # RUNNER_ENVIRONMENT is set by the runner itself, not by the workflow. Anything other than
          # github-hosted is a machine somebody owns, and this lane registers a SYSTEM task on it.
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            Write-Host ('Refusing: this lane changes the machine and RUNNER_ENVIRONMENT is "{0}", not github-hosted.' -f $env:RUNNER_ENVIRONMENT)
            exit 1
          }
          $elevated = [bool](New-Object Security.Principal.WindowsPrincipal(
            [Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host ('Disposable github-hosted runner, elevated={0}.' -f $elevated)
          if (-not $elevated) {
            Write-Host 'Refusing: the lane needs elevation and would otherwise report refused, which validates nothing.'
            exit 1
          }

      - name: Deployment lifecycle, armed
        shell: pwsh
        timeout-minutes: 20
        env:
          WAC_VM_DEPLOYMENT_LIFECYCLE: '1'
        run: |
          .\Tests\Run-Tests.ps1 -Host both -Filter VmDeploymentLifecycle *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\lifecycle-output.log"
          $code = $LASTEXITCODE

          # A GREEN REFUSAL IS THE FAILURE MODE THIS GUARD EXISTS FOR. The suite passes when it is
          # not armed, so an exit code alone cannot tell "every step passed" from "nothing ran".
          $log = Get-Content -LiteralPath "$env:RUNNER_TEMP\lifecycle-output.log" -Raw
          if ($log -match '\(not armed:') {
            Write-Host 'The lane reported NOT ARMED, so this job proved nothing about the deployment lifecycle.'
            exit 1
          }
          if ($log -notmatch 'uninstall exits clean') {
            Write-Host 'The lane did not reach its uninstall step, so the lifecycle was not exercised end to end.'
            exit 1
          }
          Write-Host 'The lane ran armed and reached its last step.'
          exit $code

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 5
        with:
          name: lifecycle-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lifecycle-output.log
          if-no-files-found: warn
          retention-days: 14
