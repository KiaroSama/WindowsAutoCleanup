name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository or to any package registry.
permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    # No matrix. `shell:` is resolved BEFORE matrix expansion, so binding it to a matrix value is
    # rejected outright with "Unrecognized named-value: 'matrix'" and the whole run fails before a
    # single job starts. It was redundant anyway: Run-Tests.ps1 -Host both launches every suite as a
    # child process under BOTH Windows PowerShell 5.1 and PowerShell 7 from one pwsh process, which
    # is the same coverage in half the runner minutes.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Whitespace and conflict markers
        shell: pwsh
        timeout-minutes: 2
        run: |
          # Diffing against the empty-tree object lints EVERY tracked file, not just the last commit:
          # a trailing space or a leftover conflict marker that arrived three commits ago is still in
          # the tree someone clones.
          $emptyTree = '4b825dc642cb6eb9a060e54bf8d69288fbee4904'
          git diff --check $emptyTree HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'git diff --check reported whitespace errors or conflict markers.'
            exit 1
          }
          Write-Host 'No whitespace errors or conflict markers.'

      - name: Static analysis
        shell: pwsh
        timeout-minutes: 10
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          # The one floating external input this repository has. There is no manifest and no
          # lockfile, so nothing else records which analyzer produced a given result, and dependabot
          # has no ecosystem to watch it through. Unpinned, a new default rule turns an unrelated
          # pull request red with findings about code it never touched, and nothing in the diff or
          # the log explains why today differs from yesterday. Bumping this is a deliberate commit:
          # update the version, rerun the scan locally, and fix what the new rules find in the same
          # change. The guard filters on the exact version because a runner image that ships its own
          # PSScriptAnalyzer would otherwise win and make the pin cosmetic.
          $analyzerVersion = '1.25.0'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq $analyzerVersion })) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module -Name PSScriptAnalyzer -RequiredVersion $analyzerVersion -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $analyzerVersion
          Write-Host ('PSScriptAnalyzer {0}' -f (Get-Module PSScriptAnalyzer).Version)
          # Scan the SHIPPED set rather than '.', so the identical command is runnable in a working
          # tree that also holds git-ignored agent runtimes and gives the same answer as CI.
          $shipped = @('Run.ps1', 'Install-WindowsAutoCleanupTask.ps1', 'Uninstall-WindowsAutoCleanupTask.ps1', 'src', 'Tests')
          $findings = @($shipped | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings .\Tests\PSScriptAnalyzerSettings.psd1 })
          if ($findings.Count -gt 0) {
            $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 240 | Write-Host
            Write-Host ('PSScriptAnalyzer reported {0} finding(s) at Error or Warning severity.' -f $findings.Count)
            exit 1
          }
          Write-Host 'PSScriptAnalyzer is clean.'

      - name: Tests on both PowerShell hosts
        shell: pwsh
        timeout-minutes: 20
        run: .\Tests\Run-Tests.ps1 -Host both -ManifestPath "$env:RUNNER_TEMP\executed-suites.txt"

      - name: Guard - every discovered suite ran
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          # -Recurse matters: without it this guard shares the runner's blind spot, so a suite in a
          # Tests subdirectory would never run AND the guard would still report success.
          #
          # A run is identified by its suite path relative to Tests\ PLUS the host it ran on, exactly
          # as the runner writes it to the manifest. Both halves are load-bearing. On the path half,
          # keying by bare file name would let two same-named suites in different subdirectories
          # collapse into one entry on BOTH sides of this comparison, so a run that executed only one
          # of them would read as complete. On the host half, a host-less entry lets a suite that ran
          # on pwsh stand in for the 5.1 run it never had - and the two hosts are precisely where
          # this project's defects live.
          $suiteRoot = (Resolve-Path -LiteralPath 'Tests').ProviderPath.TrimEnd('\') + '\'
          $discovered = @(Get-ChildItem -LiteralPath 'Tests' -Filter '*.Tests.ps1' -File -Recurse | ForEach-Object { $_.FullName.Substring($suiteRoot.Length) } | Sort-Object -Unique)
          if ($discovered.Count -eq 0) { Write-Host 'No suite matching Tests\*.Tests.ps1 exists.'; exit 1 }

          # Must match the -Host argument of the step above; the expected matrix is built here rather
          # than read from the manifest, because a matrix derived from the results could never notice
          # a host that produced no results at all.
          $hostKinds = @('pwsh', 'powershell')

          $manifest = Join-Path $env:RUNNER_TEMP 'executed-suites.txt'
          if (-not (Test-Path -LiteralPath $manifest)) { Write-Host 'The runner wrote no manifest, so no suite can be proven to have run.'; exit 1 }

          # Entries are path|host|status and are written when a run COMPLETES, so presence here is
          # evidence of a finished run rather than of a launch.
          $completed = @{}
          foreach ($line in @(Get-Content -LiteralPath $manifest | Where-Object { $_.Trim() })) {
            $parts = $line -split '\|', 3
            if ($parts.Count -lt 3) { Write-Host ('Unparsable manifest entry: {0}' -f $line); exit 1 }
            $completed[('{0}|{1}' -f $parts[0], $parts[1])] = $parts[2]
          }

          $missing = @()
          foreach ($suite in $discovered) {
            foreach ($hostKind in $hostKinds) {
              $key = '{0}|{1}' -f $suite, $hostKind
              if (-not $completed.ContainsKey($key)) { $missing += $key }
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host ('These suite x host runs produced no completed result: {0}' -f ($missing -join ', '))
            exit 1
          }

          # Reported, not failed on: a suite that ran and failed is the TEST step's verdict to give.
          # This guard answers one question - was anything omitted - and saying "did not run" about a
          # suite that ran and failed would be a false statement, not a stricter check.
          $notClean = @($completed.GetEnumerator() | Where-Object { $_.Value -ne 'exit=0' } | ForEach-Object { '{0} ({1})' -f $_.Key, $_.Value })
          if ($notClean.Count -gt 0) { Write-Host ('Completed but not clean: {0}' -f ($notClean -join ', ')) }

          Write-Host ('All {0} discovered suite(s) completed on all {1} host(s): {2} runs.' -f $discovered.Count, $hostKinds.Count, $completed.Count)
