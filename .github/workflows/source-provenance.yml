name: Source provenance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Capture tracked source only
        shell: bash
        run: |
          set -euo pipefail
          # Never archive the working directory, credentials, hooks or untracked files.
          git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-tree.txt"
          cd "$RUNNER_TEMP"
          sha256sum source.zip source-commit.txt source-tree.txt > source-sha256.txt
      - name: Retain reproducible source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-tree.txt
            ${{ runner.temp }}/source-sha256.txt
          if-no-files-found: error
          retention-days: 14
